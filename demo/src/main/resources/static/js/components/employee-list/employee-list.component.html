<div>
	<h3><b>Lista pracowników</b></h3>
	
<button class="btn btn-primary create-button" ng-click="createByModal()">Dodaj</button>
	
	<table >
		<thead>
				<tr>
				<th>Id</th>
				<th>Imię</th>
				<th>Nazwisko</th>
				<th>Detale</th>
				<th>Usuń</th>
				</tr>
			</thead>
			<tbody>
				<tr ng-repeat="employee in list">
					<td >{{ employee.id }}</td>
					<td>
						<field entity-name="employee" entity="employee" field-name="firstName"/>
					</td>
					<td>
						<field entity-name="employee" entity="employee" field-name="surname"/>
					</td>
					<td>
    					<details-button url="employee" id="employee.id"/>
					</td>
					<td>
            			<delete-btn item-id="employee.id" entity-url="employee"/>
            		</td>
				</tr>
			</tbody>
		</table>
		
 <paginator 
	page="page" size="size" sort="sort" total-pages="totalPages" total-elements="totalElements" on-change="onPageChange(page, size, sort)">
</paginator>	
	
</div>
