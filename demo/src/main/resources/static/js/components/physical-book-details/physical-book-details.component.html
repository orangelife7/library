<div>

<table>
	<thead>
		<tr>
			<th>Id</th>
			<th>Numer katalogowy</th>
			<th>Tytuł</th>
			<th>Autor</th>
			<th>Opis</th>
		</tr>
	</thead>
	<tbody>
		<tr>
			<td>{{item.id}}</td>
			<td>{{item.catalogNumber}}</td>
			<td>{{item.book.title}}</td>
			<td>{{item.book.author}}</td>
			<td>{{item.description}}</td>
		</tr>
	</tbody>
</table>
</div>

<br>
<br>

<div>
	<table>
		<thead>
				<tr>
					<th>Id</th>
					<th>Status</th>
				</tr>
		</thead>
		<tbody>
			<tr ng-repeat="item in item.orders">
				<td>{{item.id}}</td>
				<td>{{item.status}}</td>
			</tr>
		</tbody>
	</table>
</div>
