<div>

	<h3><strong>Detale książki</strong></h3>
  <table>
    <tr>
      <th>Id</th>
      <td>{{$ctrl.book.id}}</td>
    </tr>
    <tr>
      <th>Tytuł</th>
      <td>{{$ctrl.book.title}}</td>
    </tr>
    <tr>
      <th>Autor</th>
      <td>{{$ctrl.book.author}}</td>
    </tr>
    <tr>
      <th>Rok publikacji</th>
      <td>{{$ctrl.book.yearOfPublication}}</td>
    </tr>
    <tr>
      <th>ISBN</th>
      <td>{{$ctrl.book.isbn}}</td>
    </tr>
  </table>


<div>
<h3><strong>Lista egzemplarzy</strong></h3>

<table>
	<thead>
		<tr>
			<th>Id</th>
			<th>Numer katalogowy</th>
			<th>Opis</th>
			<th>Detale egzemplarza</th>
		</tr>
	</thead>
	<tbody>
		<tr ng:repeat="item in $ctrl.book.physicalBooks">
			<td>{{item.id}}</td>
			<td>{{item.catalogNumber}}</td>
			<td>{{item.description}}</td>
			<td>
          <a href="#!/physical-book-details/{{item.id}}" class="btn btn-info btn-xs">
            Detale
          </a>
          </td>
		</tr>
	</tbody>
</table>
</div>

</div>
