<style>
  .book-details th {
    background-color: #e0e0e0;
  }
  
  .book-details td {
    padding-right: 3mm;
  }
  
</style>
<div class="book-details">

	<h3><strong>Detale książki</strong></h3>
  <table border="1" cellpadding="6" cellspacing="0">
    <tr>
      <th style="width: 26mm;">Id</th>
      <td>{{$ctrl.book.id}}</td>
    </tr>
    <tr>
      <th>Tytuł</th>
      <td>{{$ctrl.book.title}}</td>
    </tr>
    <tr>
      <th>Autor</th>
      <td>{{$ctrl.book.author}}</td>
    </tr>
    <tr>
      <th>Rok publikacji</th>
      <td>{{$ctrl.book.yearOfPublication}}</td>
    </tr>
    <tr>
      <th>ISBN</th>
      <td>{{$ctrl.book.isbn}}</td>
    </tr>
  </table>

<div>
<h3><strong>Lista egzemplarzy</strong></h3>

<table border="1" cellpadding="6" cellspacing="0">
	<thead>
		<tr>
			<th>Id</th>
			<th>Numer katalogowy</th>
			<th>Opis</th>
			<th>Detale egzemplarza</th>
		</tr>
	</thead>
	<tbody>
		<tr ng:repeat="item in $ctrl.book.physicalBooks">
			<td>{{item.id}}</td>
			<td>{{item.catalogNumber}}</td>
			<td>{{item.description}}</td>
			<td style="text-align:center;">
          <a href="#!/physical-book-details/{{item.id}}" class="btn btn-info btn-xs">
            Detale
          </a>
		</tr>
	</tbody>
</table>
</div>
<!-- 
<physical-book-list book-id="$ctrl.book.id"></physical-book-list>

 -->

</div>
