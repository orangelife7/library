<div>

	<h3><strong>Detale książki</strong></h3>
  <table>
    <tr>
      <th>Id</th>
      <td>{{item.id}}</td>
    </tr>
    <tr>
      <th>Tytuł</th>
      <td>
		<field entity-name="book" entity="item" field-name="title"/>
	  </td>
    </tr>
    <tr>
      <th>Autor</th>
      <td>
		<field entity-name="book" entity="item" field-name="author"/>
	  </td>
    </tr>
    <tr>
      <th>Rok publikacji</th>
      <td>
		<field entity-name="book" entity="item" field-name="yearOfPublication"/>
	  </td>
    </tr>
    <tr>
      <th>ISBN</th>
      <td>
		<field entity-name="book" entity="item" field-name="isbn"/>
	  </td>
    </tr>
  </table>


<div>
<h3><b>Lista egzemplarzy książki</b></h3>
<input class="form-control input-sm catalog-number" placeholder="Numer katalogowy" ng-model="newCatalogNumber">
<button class="btn btn-success btn-sm create-button" ng-click="addPhysicalBook()" ng-disabled="!newCatalogNumber.length">Dodaj egzemplarz</button>
<physical-book-table list="item.physicalBooks" show-title="false" show-author="false"/>
</div>

</div>
