<div>
<table >
  <thead>
    <tr>
      <th>Id</th>
      <th>Data wypożyczenia</th>
      <th>Termin zwrotu</th>
      <th>Maksymalny termin zwrotu</th>
      <th>Data zwrotu</th>
      <th>Anulowane</th>
      <th>Przygotowane</th>
      <th>Zniszczone</th>
      <th> Płatność
      <br>
  	  <small>(jeśli wymagane)</small>
	  </th>
      <th>Kwota</th>
      <th>Status</th>
      <th>Detale</th>
    </tr>
  </thead>

  <tbody>
    <tr ng-repeat="order in $ctrl.list">
      <td>{{ order.id }}</td>
     	<td>
			<field entity-name="order" entity="order" field-name="loanDate" type="localDateTime"/>
		</td>
     	<td>
			<field entity-name="order" entity="order" field-name="deadline" editable="false"/>
		</td>
		<td>
			<field entity-name="order" entity="order" field-name="maximumDeadline" editable="false"/>
		</td>
     	<td>
			<field entity-name="order" entity="order" field-name="returnDate"/>
		</td>
      	<td>
			<field entity-name="order" entity="order" field-name="cancelled" type="boolean"/>
		</td>
      <td>
			<field entity-name="order" entity="order" field-name="prepared" type="boolean"/>
		</td>
     <td>
			<field entity-name="order" entity="order" field-name="damaged" type="boolean"/>
		</td>
      <td>
			<field entity-name="order" entity="order" field-name="paid" type="boolean"/>
		</td>
      <td>
			<field entity-name="order" entity="order" field-name="amountToPay" editable="false"/>
		</td>
      <td>
			<field entity-name="order" entity="order" field-name="status" editable="false"/>
		</td>
      <td>
		<a href="#!/order-details/{{order.id}}" class="btn btn-info btn-xs">Detale</a>
		</td>
    </tr>

    <tr ng-if="!$ctrl.list || !$ctrl.list.length">
      <td>Brak zamówień</td>
    </tr>
  </tbody>
</table>
</div>
